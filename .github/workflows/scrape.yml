name: Oreshak to Temu scraper

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Regression = known problem SKUs; Test = 1 product/category; Full = all products"
        required: true
        type: choice
        options:
          - regression
          - test
          - full
        default: regression
      category:
        description: "Optional URL slug filter for test/full, e.g. nojove-ot-balgaria"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify bundle version
        shell: bash
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = "7.1"
          test -f regression_urls.csv
      - name: Run parser tests
        run: python -m unittest discover -s tests -v
      - name: Validate template
        run: python scraper.py --schema-only
      - name: Run scraper
        shell: bash
        run: |
          EXTRA_ARGS=()
          if [ "${{ inputs.run_mode }}" = "regression" ]; then
            EXTRA_ARGS+=(--limit 0 --url-file regression_urls.csv)
          elif [ "${{ inputs.run_mode }}" = "test" ]; then
            EXTRA_ARGS+=(--limit 0 --limit-per-category 1)
          else
            EXTRA_ARGS+=(--limit 0)
          fi
          if [ -n "${{ inputs.category }}" ] && [ "${{ inputs.run_mode }}" != "regression" ]; then
            EXTRA_ARGS+=(--category "${{ inputs.category }}")
          fi
          python scraper.py "${EXTRA_ARGS[@]}"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oreshak-temu-results
          path: output/
          if-no-files-found: warn
          retention-days: 14
