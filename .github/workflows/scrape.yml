name: Oreshak to Temu scraper

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Test = 1 product per category; Full = all products"
        required: true
        type: choice
        options:
          - test
          - full
        default: test
      category:
        description: "Optional URL slug filter, e.g. nojove-ot-balgaria"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify bundle version and remove stale tests
        shell: bash
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = "6.2"
          if grep -R --line-number "test_depth_is_used_as_third_dimension" tests; then
            echo "Stale v5 test file detected. Replace the entire tests folder with v6.2."
            exit 1
          fi
      - name: Run parser tests
        run: python -m unittest discover -s tests -v
      - name: Validate template
        run: python scraper.py --schema-only
      - name: Run scraper
        shell: bash
        run: |
          EXTRA_ARGS=()
          if [ "${{ inputs.run_mode }}" = "test" ]; then
            EXTRA_ARGS+=(--limit 0 --limit-per-category 1)
          else
            EXTRA_ARGS+=(--limit 0)
          fi
          if [ -n "${{ inputs.category }}" ]; then
            EXTRA_ARGS+=(--category "${{ inputs.category }}")
          fi
          python scraper.py "${EXTRA_ARGS[@]}"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oreshak-temu-results
          path: output/
          if-no-files-found: warn
          retention-days: 14
